name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DBuildDir=..\build\Release" `
            installer\ObjectArc.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip
        shell: pwsh
        run: |
          $name = "ObjectArc-${{ steps.version.outputs.version }}-portable"
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item build\Release\ObjectArc.exe, docs\README.md "dist\$name"
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ObjectArc-${{ steps.version.outputs.version }}
          path: |
            dist/*-setup.exe
            dist/*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ObjectArc ${{ steps.version.outputs.version }}
          files: |
            dist/*-setup.exe
            dist/*.zip
          generate_release_notes: true
